name: Build AppImage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2 binutils curl squashfs-tools
          pip install pyinstaller

      - name: Build Binary
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "MagicKeyboardManager" main.py

      - name: Assemble AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/MagicKeyboardManager/* AppDir/usr/bin/

          cat << 'EOF' > AppDir/MagicKeyboardManager.desktop
          [Desktop Entry]
          Name=Magic Keyboard Manager
          Exec=MagicKeyboardManager
          Icon=keyboard
          Type=Application
          Categories=Utility;Settings;
          EOF

          # Build icon locally (no external download required)
          cat << 'EOF' > AppDir/keyboard.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
          EOF

          cp AppDir/keyboard.svg AppDir/usr/share/icons/hicolor/256x256/apps/keyboard.svg
          ln -sr AppDir/usr/bin/MagicKeyboardManager AppDir/AppRun

          # Download appimagetool from the updated official repository
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Magic_Keyboard_Manager-x86_64.AppImage

      - name: Upload Downloadable AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Magic_Keyboard_Manager-x86_64
          path: Magic_Keyboard_Manager-x86_64.AppImage
