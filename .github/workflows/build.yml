name: Build AppImage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2 binutils curl squashfs-tools
          pip install pyinstaller pillow

      - name: Build Binary
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "MagicKeyboardManager" main.py

      - name: Assemble AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/MagicKeyboardManager/* AppDir/usr/bin/

          # 1. Create the Desktop Entry
          cat << 'EOF' > AppDir/MagicKeyboardManager.desktop
          [Desktop Entry]
          Name=Magic Keyboard Manager
          Exec=MagicKeyboardManager
          Icon=keyboard
          Type=Application
          Categories=Utility;
          EOF

          # 2. Generate a valid 256x256 PNG icon using Python
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), (35, 39, 46, 255))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([15, 35, 241, 221], radius=20, outline=(220, 220, 220), width=6)
          for y in [55, 95, 135]:
              for x in range(30, 230, 32):
                  draw.rounded_rectangle([x, y, x + 24, y + 24], radius=4, fill=(160, 160, 160))
          draw.rounded_rectangle([60, 175, 196, 200], radius=4, fill=(160, 160, 160))
          img.save('AppDir/keyboard.png')
          "

          # 3. Place icon where appimagetool requires it
          cp AppDir/keyboard.png AppDir/.DirIcon
          cp AppDir/keyboard.png AppDir/usr/share/icons/hicolor/256x256/apps/keyboard.png
          ln -sr AppDir/usr/bin/MagicKeyboardManager AppDir/AppRun

          # 4. Download and run appimagetool
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Magic_Keyboard_Manager-x86_64.AppImage

      - name: Upload Downloadable AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Magic_Keyboard_Manager-x86_64
          path: Magic_Keyboard_Manager-x86_64.AppImage
